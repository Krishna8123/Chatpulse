services:
  mysql:
    image: mysql:8.0
    container_name: chatpulse-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: chatpulse
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - chat-network

  chatpulse:
    build: .
    container_name: chatpulse-app
    depends_on:
      mysql:
        condition: service_healthy
    restart: always
    ports:
      - "8070:8070"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/chatpulse
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
    networks:
      - chat-network

volumes:
  mysql_data:

networks:
  chat-network:
